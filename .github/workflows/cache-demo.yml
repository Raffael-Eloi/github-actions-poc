name: Cache Demo (npm)
on:
  workflow_dispatch:
  push:

jobs:
  build:
    name: "Build app"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
      - name: "Install dependencies"
        run: npm ci
      - name: "Build app"
        run: echo "Simulation build"
